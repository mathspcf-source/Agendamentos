<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda">
    <meta name="description" content="Sistema de agendamento para retirada de produtos">
    <title>Agenda • Retirada</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon-512.svg">
    <link rel="apple-touch-icon" href="./icon-512.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-1: #0f0f23;
            --bg-2: #1a1a3e;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.14);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-border-strong: rgba(255, 255, 255, 0.25);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --text-dimmer: rgba(255, 255, 255, 0.4);
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-1);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 120px;
        }

        .icon {
            width: 1em; height: 1em;
            display: inline-block; vertical-align: middle;
            fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* === Bg === */
        .bg-blobs {
            position: fixed; inset: 0; z-index: -1;
            overflow: hidden;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
        }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; animation: float 20s ease-in-out infinite; }
        .blob-1 { width: 400px; height: 400px; background: radial-gradient(circle, #6366f1 0%, transparent 70%); top: -100px; left: -100px; }
        .blob-2 { width: 350px; height: 350px; background: radial-gradient(circle, #ec4899 0%, transparent 70%); top: 30%; right: -120px; animation-delay: -7s; }
        .blob-3 { width: 380px; height: 380px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); bottom: -100px; left: 20%; animation-delay: -14s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* === Header === */
        header { padding: 24px 20px 16px; position: relative; z-index: 10; animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .header-inner { max-width: 600px; margin: 0 auto; }
        .header-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 100px;
            font-size: 0.7rem; font-weight: 600; color: var(--text-dim);
            margin-bottom: 12px; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .header-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        header h1 {
            font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #f0abfc 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        header p { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }

        /* === Container === */
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 5; }

        /* === Stats === */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
        .stat { background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 14px 12px; text-align: center; position: relative; overflow: hidden; transition: transform 0.3s; }
        .stat::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: 0.12; border-radius: inherit; }
        .stat:nth-child(1) { --c1: #6366f1; --c2: #8b5cf6; }
        .stat:nth-child(2) { --c1: #f59e0b; --c2: #ec4899; }
        .stat:nth-child(3) { --c1: #10b981; --c2: #06b6d4; }
        .stat .num { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; position: relative; background: linear-gradient(135deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: brightness(1.4); }
        .stat .lbl { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; position: relative; }

        /* === Lista === */
        .list { display: flex; flex-direction: column; gap: 12px; }
        .card {
            background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: var(--radius);
            padding: 18px; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            box-shadow: var(--shadow-sm);
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-color, var(--primary)), var(--accent-color2, var(--accent)));
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .card.done { opacity: 0.55; }
        .card.done::before { background: linear-gradient(90deg, #4b5563, #6b7280); }
        .card.late { --accent-color: #ef4444; --accent-color2: #f59e0b; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .card-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
        .card.done .card-name { text-decoration: line-through; text-decoration-thickness: 2px; }

        .badge { font-size: 0.65rem; font-weight: 700; padding: 5px 10px; border-radius: 100px; letter-spacing: 0.3px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; text-transform: uppercase; }
        .badge .icon { width: 12px; height: 12px; }
        .badge.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.late { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.3); } 50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); } }
        .badge.done { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .card-info { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .info-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }
        .info-row .ico { width: 24px; height: 24px; border-radius: 8px; background: var(--glass-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--text-dim); flex-shrink: 0; }
        .info-row .ico .icon { width: 13px; height: 13px; }

        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { border: none; font-family: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); font-size: 0.78rem; padding: 9px 14px; border-radius: var(--radius-xs); }
        .btn .icon { width: 14px; height: 14px; }
        .btn:active { transform: scale(0.94); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35); }
        .btn-ghost { background: var(--glass-strong); color: var(--text); border: 1px solid var(--glass-border); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* === Empty === */
        .empty { text-align: center; padding: 60px 20px; animation: fadeUp 0.6s both; }
        .empty-icon { width: 90px; height: 90px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--text-dim); animation: floaty 4s ease-in-out infinite; }
        .empty-icon .icon { width: 40px; height: 40px; stroke-width: 1.5; }
        @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .empty h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .empty p { font-size: 0.85rem; color: var(--text-dim); }

        /* === FAB === */
        .fab {
            position: fixed; bottom: 100px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white; border: none; cursor: pointer;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
            z-index: 90;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fabIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }
        .fab .icon { width: 26px; height: 26px; stroke-width: 2.5; }
        @keyframes fabIn { from { opacity: 0; transform: scale(0) rotate(-180deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
        .fab:active { transform: scale(0.9) rotate(90deg); }

        /* === Modal === */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal {
            width: 100%; max-width: 600px; max-height: 90vh;
            background: rgba(30, 30, 60, 0.85);
            backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border-strong); border-bottom: none;
            border-radius: 32px 32px 0 0; padding: 12px 20px 30px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-grabber { width: 40px; height: 4px; background: var(--glass-border-strong); border-radius: 4px; margin: 0 auto 20px; }
        .modal h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.02em; background: linear-gradient(135deg, #fff, #a5b4fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .modal h2 .icon { width: 20px; height: 20px; stroke: #a5b4fc; -webkit-text-fill-color: initial; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .field input, .field textarea {
            width: 100%; padding: 13px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xs); color: var(--text);
            font-family: inherit; font-size: 0.95rem; font-weight: 500;
            transition: all 0.25s; -webkit-appearance: none; appearance: none;
        }
        .field input::placeholder, .field textarea::placeholder { color: var(--text-dimmer); }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--primary-light); background: rgba(99, 102, 241, 0.08); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .field input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
        .field textarea { resize: vertical; min-height: 70px; }
        .btn-submit {
            width: 100%; padding: 16px; font-size: 0.95rem; font-weight: 700;
            border-radius: var(--radius-xs);
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            background-size: 200% 200%;
            color: white; border: none; cursor: pointer; font-family: inherit;
            margin-top: 10px; box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: gradientMove 3s ease infinite;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit .icon { width: 18px; height: 18px; }
        @keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .btn-submit:active { transform: scale(0.97); }

        /* === Toast === */
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 30, 60, 0.95);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border-strong);
            color: white; padding: 12px 20px; border-radius: 100px;
            font-size: 0.85rem; font-weight: 600; opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 300; display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-lg); white-space: nowrap; max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast .toast-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .toast.success .toast-icon { color: #34d399; }
        .toast.error .toast-icon { color: #f87171; }
        .toast.info .toast-icon { color: #818cf8; }
        .toast .icon { width: 18px; height: 18px; }

        /* === Bottom Nav === */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 60, 0.75);
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 100px;
            padding: 6px; display: flex; gap: 4px; z-index: 100;
            box-shadow: var(--shadow-lg);
            animation: navIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
            max-width: calc(100vw - 40px);
        }
        @keyframes navIn { from { opacity: 0; transform: translateX(-50%) translateY(40px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .nav-btn {
            border: none; background: transparent; color: var(--text-dim);
            font-family: inherit; font-size: 0.78rem; font-weight: 600;
            padding: 10px 16px; border-radius: 100px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); white-space: nowrap;
        }
        .nav-btn .icon { width: 15px; height: 15px; }
        .nav-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5); }

        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-thumb { background: var(--glass-border-strong); border-radius: 3px; }

        /* === Install Banner === */
        .install-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 150;
            padding: 12px 16px;
            background: rgba(30, 30, 60, 0.9);
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-bottom: 1px solid var(--glass-border-strong);
            transform: translateY(-100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .install-banner.show { transform: translateY(0); }
        .install-content { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
        .install-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #ec4899); display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
        .install-icon .icon { width: 20px; height: 20px; }
        .install-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .install-text strong { font-size: 0.9rem; font-weight: 700; }
        .install-text span { font-size: 0.75rem; color: var(--text-dim); }
        .install-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; padding: 8px 16px; border-radius: 100px; font-family: inherit; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.5); white-space: nowrap; }
        .install-btn:active { transform: scale(0.94); }
        .install-close { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .install-close .icon { width: 16px; height: 16px; }

        /* === Net Status === */
        .net-status {
            position: fixed; top: 16px; right: 16px; z-index: 120;
            display: flex; align-items: ce
